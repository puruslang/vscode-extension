name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release: a semver bump (patch/minor/major/prerelease) or an explicit version (e.g. 1.2.0)"
        required: true
        default: patch
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        id: bump
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          OLD="$(node -p "require('./package.json').version")"
          npm version "$VERSION_INPUT" --no-git-tag-version --allow-same-version >/dev/null
          NEW="$(node -p "require('./package.json').version")"
          echo "version=v${NEW}" >> "$GITHUB_OUTPUT"
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version is already ${NEW}; skipping the bump commit but still releasing."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and publish
        run: pnpm run publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Commit, tag and push
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          CHANGED: ${{ steps.bump.outputs.changed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$CHANGED" = "true" ]; then
            git commit -am "release: $VERSION"
          fi
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            git tag "$VERSION"
          fi
          git push origin HEAD "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.version || github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes
